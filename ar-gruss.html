<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>AR-Gruß – Cover schlägt um, Innenseite erscheint erst beim Klick</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --card-w: 340px;
      --card-h: 210px;
      --brand: #ff5f9a;
      --paper: #fff9f1;
      --paper-in: #fffdfa;
      --edge: #e8d7c7;
    }
    html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family: system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}

    /* Kamerahintergrund */
    #bg{position:fixed;inset:0;object-fit:cover;width:100%;height:100%;
      background:radial-gradient(120% 120% at 50% 50%,#0b0f16 0%,#05070b 100%);
      filter:saturate(1.05) contrast(1.05) brightness(0.95);z-index:0;}
    #vignette{position:fixed;inset:0;z-index:2;pointer-events:none;
      background:radial-gradient(120% 120% at 50% 60%,rgba(0,0,0,0) 55%,rgba(0,0,0,.35) 100%);}

    /* Bühne/Perspektive */
    #scene{position:fixed;inset:0;display:grid;place-items:center;z-index:3;
      perspective:1000px;perspective-origin:50% 50%;}

    /* Karte */
    .book{
      width:var(--card-w); height:var(--card-h);
      position:relative; transform-style:preserve-3d;
      transform:translate3d(0,20px,-800px) rotateX(10deg) rotateY(-10deg) scale(0.9);
      animation:flyin 1100ms cubic-bezier(.2,.6,.1,1) forwards;
    }
    @keyframes flyin{
      0%{transform:translate3d(0,20px,-800px) rotateX(10deg) rotateY(-10deg) scale(0.9);filter:blur(1px);}
      100%{transform:translate3d(0,0,0) rotateX(0deg) rotateY(0deg) scale(1);filter:blur(0);}
    }

    .page{
      position:absolute; top:0; height:100%; width:calc(var(--card-w)/2);
      border-radius:14px; overflow:hidden; transform-style:preserve-3d;
      backface-visibility:hidden; will-change:transform;
      box-shadow:0 10px 28px rgba(0,0,0,.35);
    }

    /* COVER (Happy Birthday) – Start sichtbar, liegt rechts und klappt nach links */
    .cover{
      right:0; transform-origin:left center;
      background:linear-gradient(145deg,#fff1e2 0%,#ffe7cf 100%);
      border-left:2px solid var(--edge);
      transform: rotateY(0deg) translateZ(0.02px);
      z-index:2; /* bleibt oben drüber */
      transition: transform 900ms cubic-bezier(.2,.7,.1,1);
    }
    .cover .front{
      position:absolute; inset:0; display:grid; place-items:center; transform:translateZ(1px);
    }
    .badge{
      display:inline-grid; place-items:center; width:130px; height:130px; border-radius:50%;
      background: radial-gradient(circle at 35% 35%, #fff 0%, #ffe7cf 40%, #ffd9b0 100%);
      box-shadow: inset 0 0 0 6px #fff, 0 12px 24px rgba(0,0,0,.25);
      color:#111; font-weight:800; font-size:18px; border: 2px dashed #ffcf8a;
    }
    .badge small{ font-size:12px; opacity:.8 }

    /* Innenseiten – Styles (werden erst per JS erzeugt!) */
    .inside-left{
      left:0; transform-origin:right center;
      background:var(--paper-in);
      box-shadow: inset -2px 0 rgba(0,0,0,.06), 0 10px 28px rgba(0,0,0,.35);
      transition: transform 900ms cubic-bezier(.2,.7,.1,1), opacity 500ms ease;
    }
    .inside-left .pattern{
      position:absolute; inset:10px; border-radius:10px;
      background:
        radial-gradient(120px 120px at 20% 30%, rgba(255,105,180,.15), rgba(255,105,180,0)),
        radial-gradient(140px 140px at 80% 70%, rgba(255,209,102,.18), rgba(255,209,102,0)),
        var(--paper-in);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.05);
    }

    .inside-right{
      right:0; transform-origin:left center;
      background:var(--paper);
      box-shadow: inset 2px 0 rgba(0,0,0,.06), 0 10px 28px rgba(0,0,0,.35);
      transition: transform 900ms cubic-bezier(.2,.7,.1,1), opacity 500ms ease;
    }
    .inner{
      position:absolute; inset:10px; border-radius:10px;
      background:var(--paper-in); box-shadow: inset 0 0 0 2px rgba(0,0,0,.05);
      display:grid; place-items:center; padding:16px; text-align:center; color:#222;
    }
    .title{font-weight:800; font-size:22px; color:#111; margin-bottom:8px;}
    .accent{ color:var(--brand); font-weight:800; }

    /* Zustände */
    .opened .cover        { transform: rotateY(-170deg) translateZ(0.02px); }
    .opened .inside-right { transform: rotateY(3deg); }
    .opened .inside-left  { transform: rotateY(-2deg); }

    /* UI / Hinweise */
    #ui{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
      z-index:5;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
    .btn{appearance:none;border:none;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;
      background:#1e88e5;color:#fff;box-shadow:0 6px 18px rgba(30,136,229,.35);}
    .btn.secondary{background:#444;box-shadow:0 6px 18px rgba(0,0,0,.35);}
    .btn:active{transform:translateY(1px);}

    #hint{position:fixed;top:14px;right:12px;z-index:4;color:#fff;font-size:12px;opacity:.85;
      background:rgba(0,0,0,.45);padding:6px 8px;border-radius:8px;user-select:none;}

    /* Start-Overlay (Kamera-Permission iOS) */
    #start{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:rgba(0,0,0,.75);color:#fff;text-align:center;padding:24px;}
    #start .panel{background:rgba(20,20,24,.85);padding:16px 18px;border-radius:12px;max-width:440px;
      box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08)}
  </style>
</head>
<body>
  <!-- Kamera -->
  <video id="bg" autoplay playsinline muted></video>
  <div id="vignette"></div>

  <!-- Szene / Karte -->
  <div id="scene">
    <div class="book" id="book">
      <!-- NUR das Cover ist anfangs da -->
      <div class="page cover" id="cover">
        <div class="front">
          <div class="badge">
            <small>Happy</small>
            <div>Birthday</div>
            <small>to You</small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Hinweis & UI -->
  <div id="hint">Tippe, um die Karte zu öffnen</div>
  <div id="ui">
    <button class="btn" id="replay">↺ Nochmal</button>
    <button class="btn secondary" id="openBtn">🎁 Öffnen</button>
    <button class="btn secondary" id="closeBtn">✖︎ Schließen</button>
  </div>

  <!-- Start-Overlay -->
  <div id="start">
    <div class="panel">
      <h3 style="margin:0 0 8px">AR-Gruß starten</h3>
      <p style="margin:0 0 12px">Wir verwenden deine Kamera als Hintergrund.<br/>Tippe auf <b>Start</b> und erlaube den Kamerazugriff.</p>
      <button class="btn" id="startBtn">Start</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('bg');
    const startOverlay = document.getElementById('start');
    const startBtn = document.getElementById('startBtn');

    const book = document.getElementById('book');
    const cover = document.getElementById('cover');
    const hint  = document.getElementById('hint');

    const replay = document.getElementById('replay');
    const openBtn = document.getElementById('openBtn');
    const closeBtn= document.getElementById('closeBtn');

    // Kamera (Rückkamera bevorzugt)
    async function startCamera(){
      try{
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: {ideal: 1280}, height: {ideal: 720} },
          audio: false
        });
        video.srcObject = stream;
      }catch(e){
        console.warn('Kamera nicht verfügbar – Fallback auf Gradient', e);
      }
    }

    // Innenseiten bei erstem Öffnen erzeugen
    let insideCreated = false;
    function ensureInsidePages(){
      if (insideCreated) return;

      // linke Innenseite (Rückseite)
      const left = document.createElement('div');
      left.className = 'page inside-left';
      left.innerHTML = '<div class="pattern"></div>';

      // rechte Innenseite (Nachricht)
      const right = document.createElement('div');
      right.className = 'page inside-right';
      right.innerHTML = `
        <div class="inner">
          <div>
            <div class="title">Für dich, <span class="accent">alles Gute!</span> 🎂</div>
            <div>
              Möge dein Jahr so <span class="accent">hell</span> funkeln<br/>
              wie der <b>Sternenhimmel</b> über Palermo ✨
            </div>
          </div>
        </div>`;

      // VOR dem Cover einfügen (damit Cover drüber liegt)
      book.insertBefore(left, cover);
      book.insertBefore(right, cover);

      // sanft einblenden
      left.style.opacity = '0';
      right.style.opacity = '0';
      requestAnimationFrame(()=>{
        left.style.opacity = '1';
        right.style.opacity = '1';
      });

      insideCreated = true;
    }

    // State
    const isOpened = () => book.classList.contains('opened');
    function openCard(){
      ensureInsidePages();           // Innenseiten hier erst bauen
      book.classList.add('opened');  // Cover klappt nach links
      hint.textContent = 'Tippe, um die Karte zu schließen';
    }
    function closeCard(){
      book.classList.remove('opened');
      hint.textContent = 'Tippe, um die Karte zu öffnen';
    }
    function replayAnim(){
      closeCard();
      // Cover wieder ganz nach vorne (falls Safari mal spinnt)
      cover.style.transform = 'rotateY(0deg) translateZ(0.02px)';
      book.style.animation = 'none';
      void book.offsetWidth; // reflow
      book.style.animation = null;
    }

    // Interaktion
    startBtn.addEventListener('click', async ()=>{
      await startCamera();
      startOverlay.style.display = 'none';
      replayAnim();
      enableParallax();
    });

    // Book/Karte per Klick toggeln
    book.addEventListener('click', ()=>{
      isOpened() ? closeCard() : openCard();
    }, {passive:true});

    openBtn.addEventListener('click', openCard);
    closeBtn.addEventListener('click', closeCard);
    replay.addEventListener('click', replayAnim);

    // Optional: Parallax
    function enableParallax(){
      const maxTilt = 8;
      function apply(beta, gamma){
        const rx = (beta  || 0) / 90 * maxTilt;
        const ry = (gamma || 0) / 90 * maxTilt;
        book.style.transform = `translate3d(0,0,0) rotateX(${rx}deg) rotateY(${ry}deg)`;
      }
      if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function'){
        DeviceOrientationEvent.requestPermission().then(state=>{
          if(state === 'granted'){
            window.addEventListener('deviceorientation', e=> apply(e.beta, e.gamma));
          }
        }).catch(()=>{});
      }else{
        window.addEventListener('deviceorientation', e=> apply(e.beta, e.gamma));
      }
    }
  </script>
</body>
</html>
